name: itantra
description: >-
  iTantra (ई-तंत्र) — Indian multilingual offline TTS/STT transceiver for
  low-bitrate ad-hoc links.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ── ML Engines ──────────────────────────────────────────────────
  sherpa_onnx: ^1.13.6
  flutter_tts: ^4.0.3

  # ── State + Persistence ─────────────────────────────────────────
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # ── Location ────────────────────────────────────────────────────
  geolocator: ^12.0.0

  # ── Audio Recording (for mic → PCM → STT pipeline) ─────────────
  record: ^7.1.1
  path_provider: ^2.1.2
  bluetooth_low_energy: ^6.2.1
  google_mlkit_translation: ^0.15.1
  audioplayers: ^6.8.1
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/configs/stt_config.json
    - assets/configs/tts_config.json
    - assets/configs/vad_config.json
    - assets/models/vad/silero_vad.onnx
    - assets/models/stt/hi/model.int8.onnx
    - assets/models/stt/hi/tokens.txt
